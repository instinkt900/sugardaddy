# sugardaddy configuration — one file describes the whole app.
# Copy to config.toml and edit. Secrets are NOT stored here:
#   SUGARDADDY_LIBRE_EMAIL / SUGARDADDY_LIBRE_PASSWORD  (LibreLinkUp login)
#   SUGARDADDY_HA_TOKEN                                  (only for `backfill`)

[librelink]
# Region code, as understood by the pylibrelinkup APIUrl enum.
# One of: AU, EU, EU2, US, AE, AP, CA, DE, FR, JP, LA, RU.
region = "AU"
# How often to poll for the latest reading (seconds). Libre updates ~every 5 min;
# 60s captures every reading without hammering the API. Minimum enforced: 15s.
poll_interval_seconds = 60
# Only needed if your LibreLinkUp account follows more than one person.
# patient_id = "00000000-0000-0000-0000-000000000000"

[database]
# SQLite file. In Docker this lives on the mounted /data volume.
path = "/data/sugardaddy.db"

[web]
host = "0.0.0.0"
port = 8080
# Display timezone (storage is always UTC). e.g. Australia/Sydney, Australia/Perth.
timezone = "Australia/Sydney"
# Display unit: "mmol/L" (Australia) or "mg/dL". Storage is always mg/dL.
units = "mmol/L"
# Target range for time-in-range, in the display unit above.
target_low = 3.9
target_high = 10.0

[insulin]
# Rapid-acting activity curve, used only for RETROSPECTIVE insulin-on-board
# context (e.g. the "IOB @ start" column on the post-meal table). Never dosing
# advice. These are yours/your clinician's to set — the defaults are typical for
# rapid analogs (aspart/NovoRapid/lispro) and just keep the maths usable.
dia_minutes = 300   # Duration of Insulin Action (~4–6 h)
peak_minutes = 75   # time to peak activity (~55 min Fiasp; ~65–75 min aspart/lispro)

# --- EXPERIMENTAL bolus reference (off unless you set isf) ---------------------
# Setting `isf` switches on a calculated dose in three places: `report` and the
# desktop post-meal table (retrospective — how a textbook formula compares to the
# doses you actually decided on), and a live panel on the phone's meal form for
# the plate you are entering. It is a cross-check to argue with, NOT dosing
# advice. See docs/plans/insulin-awareness.md — a confident number on a shaky ISF
# is worse than no number, so these stay unset until you have values you trust.
#
# These are YOURS/your clinician's — the app never infers or tunes them.
# isf and target_bg are in the display unit above (mmol/L here); icr is grams.
# isf = 2.5         # glucose drop from 1 u
# icr = 10          # grams of carb covered by 1 u
# target_bg = 6.0   # what a correction aims at; default is the target band midpoint

[prescription]
# What your clinician actually prescribed. Recorded fact, NOT a parameter —
# nothing here is ever fed into a calculation. The app only reports it back, so
# that `report` can say "prescribed 36 u, logged on 6 of 7 days" without
# expressing any opinion about the dose itself.
#
# This is the one target in the app that the app did not invent: its provenance
# is a person. That is why it needs no hedging, and also why it must never reach
# the phone's logging flow — a prescription shown at dose time stops being a
# record and becomes an instruction. See docs/plans/insulin-awareness.md.
#
# Leave the whole section empty if you have not asked. Empty means "not
# recorded", never "prescribed nothing".
#
# `reviewed` is REQUIRED once you set anything else: a stale prescription
# reported as current is worse than none, so the date travels with the values.
reviewed = ""        # ISO date the prescription was last set, e.g. "2026-03-14"
basal_product = ""   # e.g. "Toujeo" — a label for the report, never matched on
# basal_units = 36   # the prescribed nightly dose
basal_timing = ""    # free text, e.g. "evening"
rapid_product = ""   # e.g. "NovoRapid"
# If your clinician gave you a ratio, record it HERE as well as in [insulin].
# [insulin] holds what the experimental reference actually runs on (possibly your
# own placeholder); this holds what a professional chose. `report` states whether
# the two agree, which is what decides if the backtest is worth quoting.
# icr = 10
# isf = 2.5

[notify]
# Push notifications. There is exactly one: a reminder that no BASAL dose has
# been logged for a while. It is a reminder about the LOG, not dosing advice —
# it reports that nothing was recorded, never that you should take a dose.
#
# Off by default. To switch it on you also need a VAPID signing key in the
# server's environment (`sugardaddy vapid-keys` mints one; it goes in
# SUGARDADDY_VAPID_PRIVATE_KEY, never in this file), and the app must be served
# over HTTPS — browsers refuse push on plain HTTP.
enabled = false
# Contact address for the push service, so it can reach you about a misbehaving
# server. Required when enabled. "mailto:..." or "https://...".
subject = ""
# How often the running server checks. 0 turns the in-process check off, for
# driving `sugardaddy notify` from cron instead.
poll_seconds = 900
# How long a push service should hold a message for a phone that's offline.
ttl_seconds = 86400
# The reminder: expected gap between basal doses, plus grace on top before the
# phone says anything. 24 + 1 means the first notification arrives 25 h after
# your last logged basal. Raise the leniency to give yourself longer.
basal_interval_hours = 24
basal_leniency_hours = 1
# Re-push a still-unlogged basal this often, so swiping the notification away
# only buys you until the next one. Reposts are silent and replace the previous
# notification — only the first one makes a noise.
#
# Fractions are fine (0.5 = every 30 min). Short is deliberate: a reminder is
# worth most in the first hour, while "just take the usual dose" is still the
# answer. Later on it becomes a judgement call the app has no business nudging
# you about. Values below poll_seconds can't be honoured — the check only runs
# that often. 0 = say it once per missed dose and no more.
repeat_hours = 0.5

[backfill]
# Only used by the one-shot `sugardaddy backfill` command to seed history from an
# existing Home Assistant install. Unused at runtime; safe to leave blank.
ha_url = "http://192.0.2.10:8123"
ha_entity = "sensor.librelink_glucose"
# HA long-lived token comes from SUGARDADDY_HA_TOKEN, not this file.
